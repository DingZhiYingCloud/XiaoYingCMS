{% extends 'base.html' %}
{% block title %}注册 - 我的站点{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="card">
        <h2>注册</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" required placeholder="请设置用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" required placeholder="请设置密码（至少6位）">
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" name="password2" required placeholder="再次输入密码">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" style="width:100%;">注册</button>
            </div>
        </form>
        <div class="auth-link">
            已有账号？<a href="{% url 'login' %}">立即登录</a>
        </div>
    </div>
</div>
{% endblock %}
