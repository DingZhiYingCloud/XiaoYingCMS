{% extends 'base.html' %}
{% block title %}{% if mode == 'create' %}写文章{% else %}编辑文章{% endif %} - 我的站点{% endblock %}
{% block content %}
<div class="card" style="max-width:800px;">
    <h2 style="margin-bottom:20px;">
        {% if mode == 'create' %}📝 写文章{% else %}✏️ 编辑文章{% endif %}
    </h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>标题</label>
            <input type="text" name="title" value="{{ article.title|default:'' }}" required placeholder="输入文章标题">
        </div>
        <div class="form-group">
            <label>内容</label>
            <textarea name="content" required placeholder="输入文章内容...">{{ article.content|default:'' }}</textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                {% if mode == 'create' %}发布文章{% else %}保存修改{% endif %}
            </button>
            <a href="{% url 'article_list' %}" class="btn btn-outline">取消</a>
        </div>
    </form>
</div>
{% endblock %}
