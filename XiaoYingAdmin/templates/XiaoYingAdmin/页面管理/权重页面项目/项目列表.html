{% extends 'XiaoYingAdmin/template.html' %}
{% block title %}权重页面项目{% endblock %}
{% block head %}
<style>
    /* 顶部工具栏 */
    .wp-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .wp-header h2 { margin:0; font-size:18px; color:#393D49; }
    .wp-toolbar { display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
    .wp-toolbar .total-label { color:#999; font-size:13px; margin-left:auto; }

    /* 卡片视图 */
    .wp-card-wrap { display:grid; grid-template-columns:repeat(auto-fill,minmax(380px,1fr)); gap:16px; }
    .wp-card { background:#fff; border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,.06); transition:box-shadow .2s; overflow:hidden; }
    .wp-card:hover { box-shadow:0 4px 16px rgba(0,0,0,.12); }
    .wp-card-header { padding:16px 20px 10px; display:flex; align-items:flex-start; justify-content:space-between; }
    .wp-card-title { font-size:15px; font-weight:600; color:#2D3748; }
    .wp-card-title i { margin-right:6px; }
    .wp-card-type { font-size:11px; color:#999; background:#f5f5f5; padding:2px 8px; border-radius:10px; flex-shrink:0; }
    .wp-card-body { padding:0 20px 14px; }
    .wp-card-desc { font-size:13px; color:#666; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-bottom:10px; min-height:20px; }
    .wp-card-meta { display:flex; gap:16px; font-size:12px; color:#999; flex-wrap:wrap; }
    .wp-card-meta span { display:inline-flex; align-items:center; gap:4px; }
    .wp-card-meta .path { color:#888; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .wp-card-actions { border-top:1px solid #f0f0f0; padding:10px 20px; display:flex; gap:8px; flex-wrap:wrap; }
    .wp-card-actions .layui-btn { height:28px; line-height:28px; padding:0 12px; font-size:12px; }
    .wp-card-actions .layui-btn-sm i { margin-right:3px; }

    /* 状态 */
    .wp-status { display:inline-flex; align-items:center; gap:5px; font-size:12px; }
    .wp-status .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
    .wp-status .dot.running { background:#5FB878; animation:pulse 2s infinite; }
    .wp-status .dot.stopped { background:#ccc; }
    .wp-status .dot.error { background:#FF5722; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    /* 端口标签 */
    .port-badge { background:#e8f5e9; color:#2e7d32; padding:2px 8px; border-radius:10px; font-size:12px; font-weight:500; }

    /* 空状态 */
    .wp-empty { text-align:center; padding:80px 20px; color:#999; }
    .wp-empty .empty-icon { font-size:56px; color:#dce1e6; margin-bottom:16px; display:block; }
    .wp-empty p { margin-bottom:20px; font-size:15px; color:#aaa; }
    .wp-empty .layui-btn { height:34px; line-height:34px; padding:0 24px; font-size:13px; }
    .wp-empty .mode-tip { display:flex; justify-content:center; gap:20px; margin-top:16px; }
    .wp-empty .mode-tip a { color:#1E9FFF; font-size:13px; text-decoration:none; }
    .wp-empty .mode-tip a:hover { text-decoration:underline; }

    /* 加载 */
    .wp-loading { text-align:center; padding:60px 20px; color:#999; font-size:14px; }
</style>
{% endblock %}
{% block body %}
<div class="wp-header">
    <h2><i class="fas fa-weight-hanging" style="color:#1E9FFF;margin-right:8px;"></i>权重页面项目</h2>
    <div>
        <a href="{% url 'weight_project_create' %}" class="layui-btn layui-btn-normal layui-btn-sm">
            <i class="fas fa-plus"></i> 添加项目
        </a>
        <a href="{% url 'weight_project_auto_create' %}" class="layui-btn layui-btn-sm">
            <i class="fas fa-magic"></i> 系统创建
        </a>
    </div>
</div>

<div class="wp-toolbar">
    <span class="total-label" id="totalLabel">加载中...</span>
</div>

<div id="cardContainer">
    <div class="wp-loading"><i class="fas fa-spinner fa-pulse"></i> 加载项目列表...</div>
</div>
{% endblock %}
{% block js %}
<script>
layui.use(['layer'], function() {
    var layer = layui.layer;

    function escHtml(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function loadProjects() {
        var container = document.getElementById('cardContainer');
        container.innerHTML = '<div class="wp-loading"><i class="fas fa-spinner fa-pulse"></i> 加载项目列表...</div>';

        fetch('/xiaoying_admin/api/weight-project/list/')
            .then(function(r) { return r.json(); })
            .then(function(resp) {
                renderProjects(resp.projects || []);
            })
            .catch(function() {
                container.innerHTML = '<div class="wp-loading" style="color:#FF5722;">加载失败，请刷新重试</div>';
            });
    }

    function renderProjects(projects) {
        var container = document.getElementById('cardContainer');
        document.getElementById('totalLabel').textContent = '共 ' + projects.length + ' 个项目';

        if (!projects || projects.length === 0) {
            container.innerHTML = '' +
                '<div class="wp-empty">' +
                '  <span class="empty-icon"><i class="fas fa-weight-hanging"></i></span>' +
                '  <p>暂无权重页面项目</p>' +
                '  <div>' +
                '    <a href="/xiaoying_admin/weight-project/create/" class="layui-btn layui-btn-normal"><i class="fas fa-plus"></i> 添加已有项目</a>' +
                '    <a href="/xiaoying_admin/weight-project/auto-create/" class="layui-btn"><i class="fas fa-magic"></i> 系统创建项目</a>' +
                '  </div>' +
                '  <div class="mode-tip">' +
                '    <span>💡 模式A：你手动准备项目 → 添加配置</span>' +
                '    <span>模式B：系统自动创建基础项目</span>' +
                '  </div>' +
                '</div>';
            return;
        }

        var html = '<div class="wp-card-wrap">';
        projects.forEach(function(p) {
            var statusClass = p.status === 'running' ? 'running' : (p.status === 'error' ? 'error' : 'stopped');
            var statusText = p.status_display || p.status;
            var typeText = p.project_type_display || p.project_type;
            var desc = p.description || '暂无描述';
            var pathDisplay = p.project_path || '未设置';
            var showActions = p.project_type === 'manual' || (p.project_type === 'auto' && p.project_path);

            html += '<div class="wp-card" data-id="' + p.id + '">';
            html += '  <div class="wp-card-header">';
            html += '    <div class="wp-card-title"><i class="fas fa-cube" style="color:#1E9FFF;"></i> ' + escHtml(p.name) + '</div>';
            html += '    <span class="wp-card-type">' + escHtml(typeText) + '</span>';
            html += '  </div>';
            html += '  <div class="wp-card-body">';
            html += '    <div class="wp-card-desc">' + escHtml(desc) + '</div>';
            html += '    <div class="wp-card-meta">';
            html += '      <span class="wp-status"><span class="dot ' + statusClass + '"></span> ' + escHtml(statusText) + '</span>';
            html += '      <span class="port-badge"><i class="fas fa-plug"></i> ' + p.port + '</span>';
            html += '      <span><i class="far fa-clock"></i> ' + escHtml(p.create_time) + '</span>';
            html += '      <span class="path" title="' + escAttr(pathDisplay) + '"><i class="fas fa-folder"></i> ' + escHtml(pathDisplay) + '</span>';
            html += '    </div>';
            html += '  </div>';
            html += '  <div class="wp-card-actions">';
            html += '    <a href="/xiaoying_admin/weight-project/' + p.id + '/" class="layui-btn layui-btn-sm layui-btn-primary"><i class="fas fa-eye"></i> 详情</a>';
            html += '    <a href="/xiaoying_admin/weight-project/' + p.id + '/console/" class="layui-btn layui-btn-sm layui-btn-primary"><i class="fas fa-terminal"></i> 控制台</a>';

            if (p.status === 'running') {
                html += '    <button class="layui-btn layui-btn-sm layui-btn-warm btn-stop" data-id="' + p.id + '"><i class="fas fa-stop"></i> 停止</button>';
                html += '    <button class="layui-btn layui-btn-sm layui-btn-primary btn-restart" data-id="' + p.id + '"><i class="fas fa-sync"></i> 重启</button>';
            } else {
                html += '    <button class="layui-btn layui-btn-sm layui-btn-normal btn-start" data-id="' + p.id + '"><i class="fas fa-play"></i> 启动</button>';
            }

            html += '    <button class="layui-btn layui-btn-sm layui-btn-primary btn-edit" data-id="' + p.id + '"><i class="fas fa-edit"></i> 编辑</button>';
            html += '    <button class="layui-btn layui-btn-sm layui-btn-danger btn-delete" data-id="' + p.id + '"><i class="fas fa-trash"></i> 删除</button>';
            html += '  </div>';
            html += '</div>';
        });
        html += '</div>';
        container.innerHTML = html;
        bindEvents();
    }

    function bindEvents() {
        // 启动
        document.querySelectorAll('.btn-start').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var id = this.getAttribute('data-id');
                layer.load(1, { shade: [0.3, '#000'] });
                fetch('/xiaoying_admin/api/weight-project/' + id + '/start/', { method: 'POST' })
                    .then(function(r) { return r.json(); })
                    .then(function(resp) {
                        layer.closeAll('loading');
                        if (resp.error) { layer.msg(resp.error, {icon:2}); return; }
                        layer.msg(resp.message, {icon:1, time:1500});
                        loadProjects();
                    })
                    .catch(function() { layer.closeAll('loading'); layer.msg('网络错误', {icon:2}); });
            });
        });

        // 停止
        document.querySelectorAll('.btn-stop').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var id = this.getAttribute('data-id');
                layer.load(1, { shade: [0.3, '#000'] });
                fetch('/xiaoying_admin/api/weight-project/' + id + '/stop/', { method: 'POST' })
                    .then(function(r) { return r.json(); })
                    .then(function(resp) {
                        layer.closeAll('loading');
                        if (resp.error) { layer.msg(resp.error, {icon:2}); return; }
                        layer.msg(resp.message, {icon:1, time:1500});
                        loadProjects();
                    })
                    .catch(function() { layer.closeAll('loading'); layer.msg('网络错误', {icon:2}); });
            });
        });

        // 重启
        document.querySelectorAll('.btn-restart').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var id = this.getAttribute('data-id');
                layer.load(1, { shade: [0.3, '#000'] });
                fetch('/xiaoying_admin/api/weight-project/' + id + '/restart/', { method: 'POST' })
                    .then(function(r) { return r.json(); })
                    .then(function(resp) {
                        layer.closeAll('loading');
                        if (resp.error) { layer.msg(resp.error, {icon:2}); return; }
                        layer.msg(resp.message, {icon:1, time:1500});
                        loadProjects();
                    })
                    .catch(function() { layer.closeAll('loading'); layer.msg('网络错误', {icon:2}); });
            });
        });

        // 编辑
        document.querySelectorAll('.btn-edit').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var id = this.getAttribute('data-id');
                window.location.href = '/xiaoying_admin/weight-project/' + id + '/edit/';
            });
        });

        // 删除
        document.querySelectorAll('.btn-delete').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var id = this.getAttribute('data-id');
                var card = this.closest('.wp-card');
                var name = card ? card.querySelector('.wp-card-title').textContent.trim() : '';
                layer.confirm('确定删除项目「' + name + '」？<br><span style="color:#FF5722;font-size:12px;">注意：仅删除系统记录，不会删除项目文件。</span>', {icon:3, title:'确认删除'}, function(index) {
                    fetch('/xiaoying_admin/api/weight-project/' + id + '/delete/', { method: 'POST' })
                        .then(function(r) { return r.json(); })
                        .then(function(resp) {
                            if (resp.error) { layer.msg(resp.error, {icon:2}); return; }
                            layer.msg('已删除', {icon:1, time:800}, function() { loadProjects(); });
                        });
                    layer.close(index);
                });
            });
        });
    }

    // 初始化
    loadProjects();
});
</script>
{% endblock %}
